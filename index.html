<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DK CLUB - Real Bet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff}
#login{padding:20px;padding-top:50px} input{width:100%;padding:15px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff} .btn{width:100%;padding:15px;background:gold;border:none;border-radius:25px;font-weight:bold;margin-top:10px}
#main{display:none} .top{background:#1a1a1a;color:gold;padding:12px;text-align:center}
.wallet{background:linear-gradient(135deg,#ffcc00,#ff8800);margin:10px;padding:15px;border-radius:12px;color:#000;display:flex;justify-content:space-between;align-items:center}
.games{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px} .g{background:#222;border-radius:10px;padding:15px 5px;text-align:center;border:1px solid #333}
#gameBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:none;z-index:999;padding:15px;text-align:center;overflow:auto}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0} .box{background:#2a2a2a;height:55px;border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:22px;border:1px solid #444}
.betRow{display:flex;gap:8px;margin:10px 0} .betRow input{flex:1} .betRow button{padding:12px 15px;border-radius:10px;border:none;background:#333;color:#fff}
</style>
</head>
<body>
<div id="login"><h1 style="color:gold;text-align:center">DK CLUB</h1><input placeholder="+91 Number"><input type="password" placeholder="Password"><button class="btn" onclick="document.getElementById('login').style.display='none';document.getElementById('main').style.display='block'">Log in</button></div>

<div id="main">
<div class="top">DK CLUB | Balance: ₹<span id="bal">5000</span></div>
<div class="wallet"><b>₹<span id="bal2">5000</span></b><span style="font-size:12px">Playable Balance</span></div>

<div style="padding:10px">
<p style="color:#aaa;font-size:14px">Bet Amount ગમે એટલી નાખો</p>
<div class="betRow">
<input id="betAmt" type="number" value="100" placeholder="Bet Amount">
<button onclick="document.getElementById('betAmt').value=100">100</button>
<button onclick="document.getElementById('betAmt').value=500">500</button>
<button onclick="document.getElementById('betAmt').value=1000">1000</button>
</div>
</div>

<div class="games">
<div class="g" onclick="startGame('MINES')">💣<br>MINES</div>
<div class="g" onclick="startGame('GEMS')">💎<br>GEMS CLASH</div>
<div class="g" onclick="startGame('AVIATOR')">🚀<br>AVIATOR</div>
<div class="g" onclick="startGame('CHICKEN')">🐔<br>CHICKEN ROAD</div>
<div class="g" onclick="startGame('DRAGON')">🐉<br>DRAGON</div>
<div class="g" onclick="startGame('DICE')">🎲<br>DICE</div>
<div class="g" onclick="startGame('PLINKO')">🎯<br>PLINKO</div>
<div class="g" onclick="startGame('ROULETTE')">🎰<br>ROULETTE</div>
<div class="g" onclick="startGame('CRICKET')">🏏<br>CRICKET</div>
</div>
</div>

<div id="gameBox">
<h2 id="gTitle" style="color:gold"></h2>
<p>Bet: ₹<span id="showBet">0</span> | Win: ₹<span id="win">0</span> | Multiplier: <span id="mult">1.00</span>x</p>
<div id="gContent"></div>
<button class="btn" style="background:#00c851;color:#fff;margin-top:15px" onclick="cashout()">WIN - Cashout</button>
<button onclick="closeG()" style="width:100%;margin-top:10px;padding:10px;background:none;border:1px solid #555;color:#fff;border-radius:20px">Close - Loss</button>
</div>

<script>
let balance=5000, bet=0, win=0, mult=1, bombs=[];
function updateBal(){document.getElementById('bal').innerText=balance; document.getElementById('bal2').innerText=balance;}

function startGame(name){
  bet=parseInt(document.getElementById('betAmt').value);
  if(bet<=0 || bet>balance){alert('Balance ઓછું છે! Bet ઓછી નાખો. Balance: ₹'+balance); return;}
  balance-=bet; updateBal();
  win=0; mult=1;
  document.getElementById('showBet').innerText=bet;
  document.getElementById('win').innerText=0;
  document.getElementById('mult').innerText='1.00';
  document.getElementById('gTitle').innerText=name+' - ₹'+bet+' Bet';
  document.getElementById('gameBox').style.display='block';
  let c=document.getElementById('gContent'); c.innerHTML='';

  if(name=='MINES' || name=='GEMS'){
    bombs=[3,12,22]; // 3 bomb
    let grid=document.createElement('div'); grid.className='grid5';
    for(let i=0;i<25;i++){
      let d=document.createElement('div'); d.className='box'; d.innerText='?';
      d.onclick=function(){
        if(d.innerText!='?') return;
        if(bombs.includes(i)){d.innerText='💣';d.style.background='red'; alert('💣 Bomb! ₹'+bet+' Loss Thai Gaya'); closeG();}
        else{d.innerText='💎';d.style.background='#00c851'; mult+=0.9; win=Math.floor(bet*mult); document.getElementById('win').innerText=win; document.getElementById('mult').innerText=mult.toFixed(2);}
      };
      grid.appendChild(d);
    }
    c.appendChild(grid);
    c.innerHTML+='<p style="color:#aaa;font-size:12px">Gems kholo to paisa vadhe. Bomb avse to badhu loss.</p>';
  } else {
    c.innerHTML='<h1 id="roll" style="font-size:60px;margin:20px">?</h1><button class="btn" onclick="playOther()">PLAY</button>';
  }
}

function playOther(){
  let r=Math.random();
  if(r>0.45){mult=1.9; win=Math.floor(bet*mult); document.getElementById('win').innerText=win; document.getElementById('mult').innerText=mult.toFixed(2); document.getElementById('roll').innerText='WIN '+mult+'x';}
  else{document.getElementById('roll').innerText='LOSS'; alert('Loss! ₹'+bet+' Gaya'); closeG();}
}

function cashout(){
  if(win==0){alert('Pehla ek Gems kholo!'); return;}
  balance+=win; updateBal(); alert('You Won ₹'+win+' ! Bet ₹'+bet+' -> Win ₹'+win); closeG();
}
function closeG(){document.getElementById('gameBox').style.display='none';}
</script>
</body>
  </html>
