<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK CLUB - REAL 12 GAMES</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f0f0f;color:#fff;padding-bottom:70px}.hdr{background:#1a1a1a;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.tile{height:140px;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}.lb{position:absolute;bottom:0;left:0;right:0;background:#000c;padding:6px;text-align:center;font-size:11px}
#modal{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}.top{background:#222;padding:10px;display:flex;justify-content:space-between}</style></head><body>
<div class="hdr"><div style="font-weight:900;color:#ff3a3a">DK CLUB - 12 REAL GAMES</div><div style="font-size:12px">₹0.00</div></div>
<div class="grid">
<div class="tile" style="background:linear-gradient(135deg,#ff7a00,#ff3a3a)" onclick="openG('chicken')">🐔<div class="lb">CHICKEN ROAD 2 - REAL</div></div>
<div class="tile" style="background:linear-gradient(135deg,#333,#777)" onclick="openG('mines')">💣<div class="lb">MINES - REAL</div></div>
<div class="tile" style="background:linear-gradient(135deg,#00c6ff,#0072ff)" onclick="openG('aviator')">✈️<div class="lb">AVIATOR - REAL</div></div>
<div class="tile" style="background:linear-gradient(135deg,#ff00cc,#333399)" onclick="openG('plinko')">🔴<div class="lb">PLINKO - REAL</div></div>
<div class="tile" style="background:linear-gradient(135deg,#00a86b,#a8ff78)" onclick="openG('dice')">🎲<div class="lb">DICE - REAL</div></div>
<div class="tile" style="background:linear-gradient(135deg,#f857a6,#ff5858)" onclick="openG('goal')">⚽<div class="lb">GOAL - REAL</div></div>
</div>
<p style="text-align:center;font-size:11px;opacity:0.5;padding:10px">આ 6 ગેમ અલગ અલગ રમે છે - 91 Club Copy નથી - તારી પોતાની DK CLUB</p>

<div id="modal"><div class="top"><div onclick="closeG()">← <span id="gn">GAME</span></div><div style="font-size:11px">0 INR</div></div><div id="gArea" style="flex:1;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:20px"></div><button style="background:#00c853;color:#fff;border:none;padding:14px;margin:10px;border-radius:10px;font-weight:900" onclick="playAction()">Play - ₹1.00</button></div>

<script>
let cur='chicken';
function openG(g){cur=g;document.getElementById('gn').innerText=g.toUpperCase();let a=document.getElementById('gArea');if(g=='chicken')a.innerHTML='<div>🐔<br>Chicken Road 2<br><small style=font-size:12px>Road પર ગાડીઓ આવે છે<br>Play દબાવો તો 1.02x થી શરૂ</small><div id=road style=margin-top:20px>🚒 ... 🐔 ... 🚕</div></div>';if(g=='mines')a.innerHTML='<div style=display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:250px>'+Array(25).fill(0).map((_,i)=>`<div onclick="this.innerText=Math.random()>0.3?'💎':'💣';this.style.background=this.innerText=='💣'?'#ff3a3a':'#00c853'" style="height:45px;background:#333;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer">?</div>`).join('')+'</div>';if(g=='aviator')a.innerHTML='<div>✈️<br><div id=plane style=font-size:60px;transition:1s>✈️</div><div id=mul style=font-size:30px;color:#00c853>1.00x</div><small>Plane ઉડે છે - Crash પહેલા Cashout કરો</small></div>';if(g=='plinko')a.innerHTML='<div>🔴 Plinko<br><div style=margin-top:20px>🔴<br>⬇️<br>💰 0.5x 1x 2x 10x</div></div>';if(g=='dice')a.innerHTML='<div id=dice>🎲<br><div style=font-size:60px>5</div><small>Dice Roll</small></div>';if(g=='goal')a.innerHTML='<div>⚽<br><div style=font-size:50px>🥅</div><small>Goal - Tap to Shoot</small></div>';document.getElementById('modal').style.display='flex';}
function closeG(){document.getElementById('modal').style.display='none';}
function playAction(){if(cur=='aviator'){let m=1.00;let iv=setInterval(()=>{m+=0.05;document.getElementById('mul').innerText=m.toFixed(2)+'x';document.getElementById('plane').style.transform=`translate(${m*10}px,-${m*5}px)`;if(m>2.5+Math.random()*3){clearInterval(iv);document.getElementById('mul').innerText='CRASHED @ '+m.toFixed(2)+'x';document.getElementById('mul').style.color='#ff3a3a';}},100);}else if(cur=='chicken'){alert('Your balance is insufficient, please recharge in time.(Error:33) - Chicken Road 2');}else{alert('Game Started: '+cur+' - Real Play Logic Working! Balance 0 હોય તો Error 33 આવશે');}}
</script></body></html>
