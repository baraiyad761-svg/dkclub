<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK CLUB - 91 Club Clone</title>
<style>
body{margin:0;font-family:Arial;background:#f2f3f7}
.top{background:linear-gradient(90deg,#ff4e50,#ff8a8a);color:#fff;padding:15px;border-radius:0 0 20px 20px;text-align:center}
.balance{background:#fff;margin:10px;padding:15px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}
.bal{font-size:22px;font-weight:bold;color:#ff4e50}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;padding:10px;text-align:center;box-shadow:0 2px 5px #0001}
.card img{width:100%;border-radius:10px;height:100px;object-fit:cover}
.card p{margin:5px 0 0;font-weight:bold}
.btn{background:linear-gradient(90deg,#008cff,#00c6ff);color:#fff;border:none;padding:10px 20px;border-radius:20px;width:100%;margin-top:5px;font-weight:bold}
#gameBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0b2a5b;z-index:99;padding:10px;overflow:auto;color:#fff}
.gemGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.gem{height:60px;background:#123a7a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px}
.fortune{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
</style>
</head>
<body>

<div class="top">
<h2 style="margin:0">DK CLUB</h2>
<p style="margin:0;font-size:12px">kanpur91.com Original Clone</p>
</div>

<div class="balance">
<div>Total balance<br><span class="bal">₹<span id="bal">5000.00</span></span></div>
<button onclick="alert('Deposit Coming Soon')" style="background:#ff4e50;color:#fff;border:none;padding:8px 15px;border-radius:20px">Enter wallet</button>
</div>

<div class="grid">
<div class="card" onclick="openMines()"><img src="https://cdn-icons-png.flaticon.com/512/3612/3612021.png"><p>💣 MINES CLASH</p><button class="btn">PLAY NOW</button></div>
<div class="card" onclick="openGems()"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006584.png"><p>💎 FORTUNE GEMS</p><button class="btn">PLAY NOW</button></div>
<div class="card" onclick="openFish()"><img src="https://cdn-icons-png.flaticon.com/512/3079/3079166.png"><p>🐟 HAPPY FISHING</p><button class="btn">PLAY NOW</button></div>
<div class="card"><img src="https://cdn-icons-png.flaticon.com/512/3090/3090173.png"><p>🎰 WIN GO</p><button class="btn">PLAY NOW</button></div>
</div>

<!-- GAME BOX -->
<div id="gameBox">
<button onclick="closeGame()" style="float:right;background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px">X</button>
<h2 id="gTitle">Game</h2>
<div id="gContent"></div>
</div>

<script>
let balance = 5000;
function openMines(){
document.getElementById('gameBox').style.display='block';
document.getElementById('gTitle').innerText='MINES CLASH - BLUE EDITION';
let h='<p>Bet: ₹50 | Balance: ₹'+balance+'</p><div class="gemGrid">';
for(let i=0;i<25;i++) h+=`<div class="gem" onclick="this.innerText='💎';this.style.background='#00c6ff'">?</div>`;
h+='</div><br><button class="btn" onclick="balance+=100;document.getElementById(`bal`).innerText=balance;alert(`You Win ₹100!`)">CASHOUT</button>';
document.getElementById('gContent').innerHTML=h;
}
function openGems(){
document.getElementById('gameBox').style.display='block';
document.getElementById('gTitle').innerText='FORTUNE GEMS - SUPER WIN';
let symbols=['💎','🔷','🟦','J','A'];
let h='<div style="background:gold;padding:10px;border-radius:10px;color:#000;text-align:center">SUPER WIN 15X MULTIPLIER</div><div class="fortune" style="margin-top:15px">';
for(let i=0;i<9;i++) h+=`<div class="gem" style="background:#fff;color:#000">${symbols[Math.floor(Math.random()*5)]}</div>`;
h+='</div><br><p>Bet: ₹3.00 | Balance: ₹'+balance+'</p><button class="btn" style="background:orange" onclick="openGems()">SPIN</button>';
document.getElementById('gContent').innerHTML=h;
}
function openFish(){
document.getElementById('gameBox').style.display='block';
document.getElementById('gTitle').innerText='HAPPY FISHING';
document.getElementById('gContent').innerHTML=`<div style="text-align:center"><h3>Select Mode</h3><button class="btn" style="background:#00c6ff;margin:10px" onclick="alert('Tutorial Started - Free Play')">Tutorial Mode (Free)<br>For Newbies</button><br><button class="btn" style="background:#ff4e50;margin:10px" onclick="alert('Real Money Mode Started')">Real Money Mode<br>For Veterans</button><br><img src="https://cdn-icons-png.flaticon.com/512/3079/3079166.png" style="width:150px;margin-top:20px"></div>`;
}
function closeGame(){document.getElementById('gameBox').style.display='none';}
</script>

</body>
</html>
                                                                     </>
