<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>91 CLUB Original</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f6fa;padding-bottom:70px}
.card{border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;background:#fff;box-shadow:0 2px 5px #0001}
.card img{width:100%;height:100%;object-fit:cover}
.sec{margin:8px}.cards{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.badge{position:absolute;top:4px;left:4px;background:#8a2be2;color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;font-weight:bold;z-index:2}
.gem-badge{position:absolute;top:0;left:0;background:#ff00ff;color:#fff;padding:2px 6px;font-size:10px;border-radius:0 0 8px 0;font-weight:bold}
</style>
</head>
<body>

<div style="padding:10px;background:#fff;display:flex;justify-content:space-between"><b>Lobby</b><span>Mini game Slots Card Fishing</span></div>

<div class="sec">
<b>⭐ Recommended Games</b>
<div class="cards">
<div class="card" style="min-width:140px;height:160px"><img src="lobby_aviator1.png"></div>
<div class="card" style="min-width:140px;height:160px"><img src="lobby_aviator2.png"></div>
<div class="card" style="min-width:140px;height:160px"><img src="lobby_aviator3.png"></div>
</div>
</div>

<div class="sec">
<b>Lottery</b>
<div class="cards" style="flex-wrap:wrap">
<div class="card" style="width:48%;height:95px"><img src="lobby_wingo.png"></div>
<div class="card" style="width:48%;height:95px"><img src="lobby_k3.png"></div>
<div class="card" style="width:48%;height:95px"><img src="lobby_5d.png"></div>
<div class="card" style="width:48%;height:95px"><img src="lobby_trx.png"></div>
<div class="card" style="width:100%;height:90px;margin-top:5px"><img src="lobby_moto.png"></div>
</div>
</div>

<div class="sec">
<b>Mini game</b>
<div class="cards">
<div class="card" style="min-width:110px;height:140px"><img src="mid_mines.png"></div>
<div class="card" style="min-width:110px;height:140px"><img src="mid_ronaldinho.png"></div>
<div class="card" style="min-width:110px;height:140px"><img src="mid_moneycoming.png"></div>
</div>
</div>

<div class="sec">
<b>Slots</b>
<div class="cards">
<div class="card" style="min-width:110px;height:150px"><img src="mid_ng_slots.png"></div>
<div class="card" style="min-width:110px;height:150px"><img src="mid_9g_slots.png"></div>
<div class="card" style="min-width:110px;height:150px"><img src="mid_pg_slots.png"></div>
</div>
</div>

<div class="sec">
<b>Super Jackpot - Fortune Gems with small photos</b>
<div class="cards">
<div class="card" style="min-width:130px;height:160px">
<div class="gem-badge">31.1X</div><img src="bottom_money_coming_expanded.png">
</div>
<div class="card" style="min-width:130px;height:160px">
<div class="gem-badge">16X</div><img src="bottom_fortune_gems_jili_15x.png">
</div>
<div class="card" onclick="openGems()" style="min-width:130px;height:160px;border:2px solid gold">
<div class="gem-badge" style="background:gold;color:#000">19.2X JILI</div>
<img src="bottom_fortune_gems_main.png">
<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,black);color:#fff;text-align:center;font-weight:bold;padding:5px;font-size:11px">FORTUNE GEMS - CLICK</div>
</div>
</div>
</div>

<!-- GEMS WORKING PAGE WITH SAME PHOTOS -->
<div id="gemPage" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#1a0a2e;z-index:999;padding:10px">
<button onclick="document.getElementById('gemPage').style.display='none'" style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px;float:right">X</button>
<h2 style="color:gold;text-align:center">FORTUNE GEMS</h2>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:40px">
<div class="card" style="height:80px"><img src="bottom_fortune_gems_main.png"></div>
<div class="card" style="height:80px"><img src="bottom_fortune_gems_main.png"></div>
<div class="card" style="height:80px"><img src="bottom_fortune_gems_jili_15x.png"></div>
<div class="card" style="height:80px"><img src="bottom_money_coming_expanded.png"></div>
<div class="card" style="height:80px"><img src="bottom_fortune_gems_main.png"></div>
<div class="card" style="height:80px"><img src="bottom_fortune_gems_main.png"></div>
</div>
<button onclick="alert('WIN! ₹'+(Math.floor(Math.random()*100)+50))" style="width:100%;margin-top:20px;background:orange;color:#fff;padding:12px;border:none;border-radius:20px;font-weight:bold">SPIN ₹10</button>
</div>

<script>
function openGems(){document.getElementById('gemPage').style.display='block';}
</script>

</body>
</html>
