<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAME</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{background:#1a1a1a;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}.g{flex:1;position:relative;background:#5a5a5a;overflow:hidden}.sw{position:absolute;left:0;top:0;bottom:0;width:30%;background:#9e9e9e;border-right:3px solid #777}.rd{position:absolute;left:30%;right:0;top:0;bottom:0;background:#4a4a4a}.ck{position:absolute;left:8%;top:35%;font-size:50px;z-index:10}.mh{position:absolute;background:#222;border:3px solid #555;border-radius:50%;width:75px;height:75px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}.car{position:absolute;font-size:35px;z-index:5}.btm{background:#1e1e1e;padding:10px}.bet{display:flex;gap:5px;background:#2a2a2a;padding:8px;border-radius:8px;margin-bottom:8px;align-items:center}.bet input{background:#000;color:#fff;border:1px solid #444;padding:5px;width:70px;text-align:center;border-radius:6px}.play{background:#00c853;color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-size:17px;font-weight:900}.pop{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;display:none;align-items:center;justify-content:center;z-index:99}.box{background:#2a2a2a;padding:20px;border-radius:12px;width:85%;max-width:320px;text-align:center}</style></head><body>
<div class="top"><div>← <span id="gn">CHICKEN ROAD 2</span></div><div style="font-size:12px;background:#ff9800;color:#000;padding:2px 8px;border-radius:10px">₹0.00</div><div style="font-size:11px;opacity:0.6">0 INR</div></div>
<div class="g" id="ga"><div class="sw"></div><div class="rd"></div><div style="position:absolute;left:52%;top:0;bottom:0;border-left:2px dashed #fff;opacity:0.4"></div><div class="ck" id="ch">🐔</div><div class="mh" id="m1" style="left:45%;top:30%">1.02x</div><div class="mh" style="left:82%;top:30%;opacity:0.6">1.05x</div><div class="car" id="c1" style="left:110%;top:8%">🚒</div><div class="car" id="c2" style="left:130%;top:58%">🚕</div><div class="car" id="c3" style="left:160%;top:32%">🚓</div></div>
<div class="btm"><div class="bet"><span style="font-size:10px">Bet:</span><button style="background:#333;color:#fff;border:none;padding:4px 7px;border-radius:4px">−</button><input id="bv" value="1.00 INR" readonly><button style="background:#333;color:#fff;border:none;padding:4px 7px;border-radius:4px">+</button><button style="background:#333;color:#fff;border:none;padding:4px 6px;border-radius:4px;font-size:10px">x0.5</button><button style="background:#333;color:#fff;border:none;padding:4px 6px;border-radius:4px;font-size:10px">x2.0</button></div><div style="font-size:11px;margin-bottom:6px">Easy ▼ | <span id="gn2">CHICKEN ROAD 2</span></div><button class="play" onclick="openPop()">Play</button></div>
<div class="pop" id="pop"><div class="box"><p style="font-size:13px">Your balance is insufficient, please recharge in time.(Error:33)</p><p style="font-size:11px;margin-top:6px;opacity:0.7" id="errGame">Game: CHICKEN ROAD 2</p><button onclick="document.getElementById('pop').style.display='none'" style="margin-top:12px;background:#444;color:#fff;border:none;padding:8px 20px;border-radius:6px">OK</button></div></div>
<script>
const url=new URLSearchParams(location.search);let gname=url.get('n')||'CHICKEN ROAD 2';document.getElementById('gn').innerText=gname;document.getElementById('gn2').innerText=gname;document.getElementById('errGame').innerText='Game: '+gname;document.title=gname+' - Play';
// emoji logic as per game name
let em='🐔';if(gname.includes('AVIATOR'))em='✈️';else if(gname.includes('MINES'))em='💣';else if(gname.includes('CRICKET'))em='🏏';else if(gname.includes('FISHING')||gname.includes('FISH'))em='🐟';else if(gname.includes('DRAGON')||gname.includes('TIGER'))em='🐯';else if(gname.includes('DICE')||gname.includes('PLINKO'))em='🎲';else if(gname.includes('WHEEL')||gname.includes('ROULETTE'))em='🎡';else if(gname.includes('COIN')||gname.includes('MONEY'))em='🪙';else if(gname.includes('GOAL')||gname.includes('PUBG')||gname.includes('HORSE'))em='⚽';else if(gname.includes('GEMS')||gname.includes('ACE')||gname.includes('GOLD'))em='💎';
document.getElementById('ch').innerText=em;
let mult=1.02;let cars=[{e:document.getElementById('c1'),x:110,s:1.1},{e:document.getElementById('c2'),x:130,s:0.9},{e:document.getElementById('c3'),x:160,s:1}];
setInterval(()=>{cars.forEach(c=>{c.x-=c.s;if(c.x<-15)c.x=110+Math.random()*40;c.e.style.left=c.x+'%';});mult+=0.001;document.getElementById('m1').innerText=mult.toFixed(2)+'x';},35);
function openPop(){document.getElementById('pop').style.display='flex';}
</script></body></html>￼Enter
