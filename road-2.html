here<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHICKEN ROAD 2</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}.top{background:#1a1a1a;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.game{flex:1;position:relative;background:#6b6b6b;overflow:hidden}.sidewalk{position:absolute;left:0;top:0;bottom:0;width:30%;background:#a0a0a0;border-right:3px solid #777}.road{position:absolute;left:30%;right:0;top:0;bottom:0;background:#4e4e4e}.chick{position:absolute;left:8%;top:35%;font-size:55px;z-index:10;transition:0.3s}.mh{position:absolute;background:#222;border:3px solid #555;border-radius:50%;width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-weight:bold}.car{position:absolute;font-size:40px;z-index:5}.bottom{background:#1e1e1e;padding:10px}.bet{display:flex;gap:6px;background:#2a2a2a;padding:8px;border-radius:8px;margin-bottom:8px}.bet input{background:#000;color:#fff;border:1px solid #444;padding:6px;width:80px;text-align:center;border-radius:6px}.play{background:#00c853;color:#fff;border:none;width:100%;padding:14px;border-radius:10px;font-size:18px;font-weight:900}.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;display:none;align-items:center;justify-content:center;z-index:100}.box{background:#2a2a2a;padding:20px;border-radius:12px;width:85%;max-width:320px;text-align:center}</style></head><body>
<div class="top"><div>← CHICKEN ROAD ⓘ</div><div style="display:flex;gap:8px;align-items:center"><span style="background:#ff9800;padding:2px 8px;border-radius:10px;font-size:12px">₹0.00</span><span>+</span></div><div style="font-size:12px;opacity:0.6">0 INR</div></div>
<div class="game" id="g"><div class="sidewalk"></div><div class="road"></div><div style="position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #fff;opacity:0.5"></div><div class="chick" id="ch">🐔</div><div class="mh" style="left:45%;top:30%">1.02x</div><div class="car" id="c1" style="left:110%;top:5%">🚒</div><div class="car" id="c2" style="left:110%;top:62%">🚕</div><div class="car" id="c3" style="left:110%;top:32%">🚕</div></div>
<div class="bottom"><div class="bet"><span style="font-size:11px">Bet ID:</span><button style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px">−</button><input value="1.00 INR" readonly><button style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px">+</button><button style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:11px">x0.5</button><button style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:11px">x2.0</button></div><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px"><span>Easy ▼</span></div><button class="play" onclick="document.getElementById('pop').style.display='flex'">Play</button></div>
<div class="popup" id="pop"><div class="box"><p style="font-size:13px">Your balance is insufficient, please recharge in time.(Error:33)</p><button onclick="document.getElementById('pop').style.display='none'" style="margin-top:12px;background:#444;color:#fff;border:none;padding:8px 20px;border-radius:6px">OK</button></div></div>
<script>
let cars=[{el:document.getElementById('c1'),x:110,s:1.2,y:5},{el:document.getElementById('c2'),x:140,s:1,y:62},{el:document.getElementById('c3'),x:180,s:0.8,y:32}];
setInterval(()=>{cars.forEach(c=>{c.x-=c.s;if(c.x<-15)c.x=110+Math.random()*50;c.el.style.left=c.x+'%';});},30);
</script></body></html>
